<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Candlestick subtle background grids -->
  <line x1="120" y1="90" x2="120" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="256" y1="90" x2="256" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="392" y1="90" x2="392" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  
  <!-- Delta Symbol with Algo Momentum Peak -->
  <path d="M256 100 L400 380 L112 380 Z" fill="none" stroke="url(#deltaGrad)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Internal Trading Vector / Pulse -->
  <path d="M190 330 L235 255 L285 300 L345 190" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="345" cy="190" r="10" fill="#34d399" />
  <circle cx="235" cy="255" r="7" fill="#06b6d4" />
</svg>
