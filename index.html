    <!-- Filter benign Vite dev HMR socket disconnections and disable React 19 profiler cross-origin frame inspection -->
    <script>
      (function() {
        // Disable React 19 User Timing profiling in cross-origin iframe to prevent SecurityError when inspecting window/event props
        try {
          if (window.console) {
            try {
              Object.defineProperty(window.console, 'timeStamp', {
                get: function() { return undefined; },
                set: function() {},
                configurable: true,
              });
            } catch (e) {
              window.console.timeStamp = undefined;
            }
          }
        } catch (e) {}

        function isBenignError(text) {
          if (!text) return false;
          var str = String(text);
          return (
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('[vite] failed to connect to websocket') !== -1 ||
            str.indexOf('vite:ws:disconnect') !== -1 ||
            str.indexOf('cross-origin frame') !== -1 ||
            str.indexOf('cross-origin') !== -1 ||
            str.indexOf('Blocked a frame with origin') !== -1 ||
            str.indexOf('Should not already be working') !== -1 ||
            str.indexOf('addObjectDiffToProperties') !== -1 ||
            str.indexOf('logComponentRender') !== -1 ||
            str.indexOf('identity-credentials-get') !== -1 ||
            str.indexOf('FedCM') !== -1 ||
            str.indexOf('GSI_LOGGER') !== -1 ||
            (str.indexOf('@vite/client') !== -1 && str.indexOf('WebSocket') !== -1)
          );
        }

        // 1. Intercept console.error to filter out benign notices
        var originalConsoleError = window.console && window.console.error;
        if (originalConsoleError) {
          window.console.error = function() {
            var fullText = '';
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              if (arg instanceof Error) {
                fullText += ' ' + (arg.message || '') + ' ' + (arg.stack || '');
              } else if (typeof arg === 'object' && arg !== null) {
                try {
                  fullText += ' ' + JSON.stringify(arg);
                } catch (e) {
                  fullText += ' [object]';
                }
              } else {
                fullText += ' ' + String(arg);
              }
            }

            if (isBenignError(fullText)) {
              return;
            }
            return originalConsoleError.apply(this, arguments);
          };
        }

        // 1b. Intercept console.warn to filter out benign iframe/GSI/FedCM notices
        var originalConsoleWarn = window.console && window.console.warn;
        if (originalConsoleWarn) {
          window.console.warn = function() {
            var fullText = '';
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              if (arg instanceof Error) {
                fullText += ' ' + (arg.message || '') + ' ' + (arg.stack || '');
              } else if (typeof arg === 'object' && arg !== null) {
                try {
                  fullText += ' ' + JSON.stringify(arg);
                } catch (e) {
                  fullText += ' [object]';
                }
              } else {
                fullText += ' ' + String(arg);
              }
            }

            if (isBenignError(fullText)) {
              return;
            }
            return originalConsoleWarn.apply(this, arguments);
          };
        }

        // 2. Intercept window.onerror
        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var text = String(message || '') + ' ' + String(source || '') + ' ' + ((error && (error.stack || error.message)) || '');
          if (isBenignError(text)) {
            return true;
          }
          if (typeof originalOnError === 'function') {
            return originalOnError.call(this, message, source, lineno, colno, error);
          }
        };

        // 3. Intercept window.onunhandledrejection
        var originalOnUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function(event) {
          var reason = event && event.reason;
          var text = (reason && (reason.stack || reason.message)) || String(reason || '');
          if (isBenignError(text)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return;
          }
          if (typeof originalOnUnhandledRejection === 'function') {
            return originalOnUnhandledRejection.call(this, event);
          }
        };

        // 4. Capture-phase event listeners to stop propagation
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var text = (reason && (reason.stack || reason.message)) || String(reason || '');
          if (isBenignError(text)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var text = (e.message || '') + ' ' + (e.filename || '') + ' ' + ((e.error && (e.error.stack || e.error.message)) || '');
          if (isBenignError(text)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
